name: interview-pad-dev

services:
  gateway:
    image: caddy:2-alpine
    ports:
      - "127.0.0.1:3030:3030"
    volumes:
      - ./Caddyfile.dev:/etc/caddy/Caddyfile:ro
    depends_on:
      - rustpad
      - ptyd

  rustpad:
    build:
      context: ./rustpad
      dockerfile: Dockerfile.local
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      LUNA_ENABLED: "1"
      LUNA_PROMPT_PATH: /prompts/luna.md
      EXPIRY_DAYS: "1"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    volumes:
      - ./rustpad/rustpad-server/prompts/luna.md:/prompts/luna.md:ro

  ptyd:
    build: ./ptyd
    environment:
      SESSIONS_VOLUME: ${INTERVIEW_PAD_SESSIONS_VOLUME:-interview-pad-dev-pty-sessions}
      SESSIONS_DIR: /sessions
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - pty-sessions:/sessions

volumes:
  pty-sessions:
    name: ${INTERVIEW_PAD_SESSIONS_VOLUME:-interview-pad-dev-pty-sessions}

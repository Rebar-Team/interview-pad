name: interview-pad-dev

services:
  gateway:
    image: caddy:2-alpine
    ports:
      - "127.0.0.1:3030:3030"
    volumes:
      - ./Caddyfile.dev:/etc/caddy/Caddyfile:ro
    depends_on:
      - rustpad
      - ptyd

  rustpad:
    build:
      context: ./rustpad
      dockerfile: Dockerfile.local
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ASSISTANT_ENABLED: "1"
      PUBLIC_ORIGIN: http://127.0.0.1:3030
      SESSION_SECRET: ${SESSION_SECRET:-local-only-session-secret-0123456789}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      # Passwordless sign-in at /auth/dev; the server ignores it off loopback.
      DEV_LOGIN_EMAIL: ${DEV_LOGIN_EMAIL:-dev@withrebar.ai}
      ROOM_TTL_MINUTES: ${ROOM_TTL_MINUTES:-360}
      ASSISTANT_PROMPT_PATH: /prompts/assistant.md
      EXPIRY_DAYS: "1"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    volumes:
      - ./rustpad/rustpad-server/prompts/assistant.md:/prompts/assistant.md:ro

  ptyd:
    build: ./ptyd
    environment:
      SESSIONS_VOLUME: ${INTERVIEW_PAD_SESSIONS_VOLUME:-interview-pad-dev-pty-sessions}
      SESSIONS_DIR: /sessions
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - pty-sessions:/sessions

volumes:
  pty-sessions:
    name: ${INTERVIEW_PAD_SESSIONS_VOLUME:-interview-pad-dev-pty-sessions}
